name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install system audio libraries
        # recorder.py imports sounddevice (PortAudio) and soundfile (libsndfile)
        # at module load; both need their native libs present to import.
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libsndfile1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Provide runtime config
        # config.yaml is gitignored (holds personal settings); src/config.py
        # loads it at import, so CI seeds it from the tracked example.
        run: cp config.yaml.example config.yaml

      - name: Run tests
        run: pytest -q
