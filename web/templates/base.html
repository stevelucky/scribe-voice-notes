<!doctype html>
<html lang="en" class="bg-paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scribe</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/static/favicon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <script>
    // Apply the theme before first paint to avoid a flash. Setting is one of
    // 'auto' (follow the OS, the default), 'light', or 'dark'.
    (function () {
      try {
        var q = new URLSearchParams(location.search).get('theme');
        if (q === 'dark' || q === 'light' || q === 'auto') localStorage.setItem('scribe-theme', q);
        var s = localStorage.getItem('scribe-theme') || 'auto';
        var dark = s === 'dark' ||
          (s === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.dataset.themeSetting = s;
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            paper:   'rgb(var(--c-paper) / <alpha-value>)',
            surface: 'rgb(var(--c-surface) / <alpha-value>)',
            ink: {
              DEFAULT: 'rgb(var(--c-ink) / <alpha-value>)',
              soft:    'rgb(var(--c-ink-soft) / <alpha-value>)',
              faint:   'rgb(var(--c-ink-faint) / <alpha-value>)',
            },
            line: 'rgb(var(--c-line) / <alpha-value>)',
            accent: {
              DEFAULT: 'rgb(var(--c-accent) / <alpha-value>)',
              hover:   'rgb(var(--c-accent-hover) / <alpha-value>)',
              tint:    'rgb(var(--c-accent-tint) / <alpha-value>)',
            },
          },
          fontFamily: {
            display: ['Newsreader', 'Georgia', 'serif'],
            sans: ['"IBM Plex Sans"', 'system-ui', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace'],
          },
        },
      },
    }
  </script>
  <style>
    :root {
      --c-paper: 251 250 249;  --c-surface: 255 255 255;
      --c-ink: 28 27 25;       --c-ink-soft: 87 83 78;   --c-ink-faint: 120 113 108;
      --c-line: 236 232 226;
      --c-accent: 29 53 87;    --c-accent-hover: 41 78 122;  --c-accent-tint: 237 241 246;
      --c-accent-on: 255 255 255;
    }
    .dark {
      --c-paper: 22 21 18;     --c-surface: 30 28 25;
      --c-ink: 237 232 224;    --c-ink-soft: 176 169 159; --c-ink-faint: 138 130 120;
      --c-line: 47 44 40;
      --c-accent: 138 176 222; --c-accent-hover: 167 197 232; --c-accent-tint: 32 44 60;
      --c-accent-on: 20 19 16;
    }

    .htmx-indicator { opacity: 0; }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }
    .item-row.htmx-swapping { opacity: 0; transition: opacity 200ms ease-out; }
    .archiving {
      overflow: hidden !important;
      transition: max-height 300ms ease, opacity 180ms ease,
                  padding 300ms ease, margin 300ms ease;
    }

    /* Primary action button — themed fill that flips with dark mode. */
    .btn-primary { background: rgb(var(--c-accent)); color: rgb(var(--c-accent-on));
      transition: background-color 150ms ease, opacity 150ms ease; }
    .btn-primary:hover:not(:disabled) { background: rgb(var(--c-accent-hover)); }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; }

    /* Busy/idle label swap for any htmx button (refresh, etc.). */
    .lbl-busy { display: none; }
    .htmx-request .lbl-idle { display: none; }
    .htmx-request .lbl-busy { display: inline-flex; }
    .spin { animation: scribe-spin .8s linear infinite; }
    @keyframes scribe-spin { to { transform: rotate(360deg); } }

    /* Live input equalizer in the Develop-an-idea recorder. */
    .dev-eq i { width: 2px; height: 15%; background: currentColor; border-radius: 1px; transition: height 90ms linear; }

    /* Hide the scrollbar on horizontally-scrollable strips (mobile tabs). */
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    /* Theme button shows the icon for the CURRENT setting (auto/light/dark).
       Driven by html[data-theme-setting] so it's correct before JS runs. */
    [data-theme-icon] { display: none; }
    html[data-theme-setting="auto"]  [data-theme-icon="auto"],
    html[data-theme-setting="light"] [data-theme-icon="light"],
    html[data-theme-setting="dark"]  [data-theme-icon="dark"] { display: block; }
    html:not([data-theme-setting]) [data-theme-icon="auto"] { display: block; }

    .lift { transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease; }
    .lift:hover { transform: translateY(-1px); box-shadow: 0 6px 20px -12px rgba(0,0,0,.35); }

    .eyebrow {
      font-family: 'Newsreader', Georgia, serif; font-style: italic;
      font-size: .9rem; color: rgb(var(--c-accent)); letter-spacing: .01em;
      display: flex; align-items: baseline; gap: .75rem; margin-bottom: .85rem;
    }
    .eyebrow::after { content: ""; flex: 1; height: 1px; background: rgb(var(--c-line)); }

    .brief-prose { font-family: 'Newsreader', Georgia, serif; color: rgb(var(--c-ink)); }
    .brief-prose h2 { font-family: 'IBM Plex Sans', sans-serif; font-size: .7rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .08em; color: rgb(var(--c-accent)); margin: 1.25rem 0 .4rem; }
    .brief-prose h2:first-child { margin-top: 0; }
    .brief-prose p { font-size: 1.05rem; line-height: 1.65; margin: .5rem 0; }
    .brief-prose ul { list-style: none; margin: .4rem 0; padding: 0; }
    .brief-prose li { font-size: 1.02rem; line-height: 1.55; margin: .35rem 0; padding-left: 1.1rem; position: relative; }
    .brief-prose li::before { content: ""; position: absolute; left: .1rem; top: .72em;
      width: .35rem; height: .35rem; border-radius: 9999px; background: rgb(var(--c-accent)); }
    .brief-prose strong { font-weight: 600; color: rgb(var(--c-ink)); }

    .md { font-family: 'IBM Plex Sans', sans-serif; }
    .md h1 { font-family: 'Newsreader', Georgia, serif; font-size: 1.4rem; font-weight: 600; color: rgb(var(--c-ink)); margin: 1rem 0 .5rem; }
    .md h2 { font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: rgb(var(--c-accent)); margin: 1.2rem 0 .4rem; }
    .md h2:first-child { margin-top: 0; }
    .md h3 { font-size: .95rem; font-weight: 600; color: rgb(var(--c-ink)); margin: .7rem 0 .2rem; }
    .md ul { list-style: disc; padding-left: 1.25rem; margin: .3rem 0; }
    .md ol { list-style: decimal; padding-left: 1.25rem; margin: .3rem 0; }
    .md li { margin: .2rem 0; font-size: .9rem; color: rgb(var(--c-ink-soft)); }
    .md p { font-size: .9rem; color: rgb(var(--c-ink-soft)); line-height: 1.6; margin: .4rem 0; }
    .md strong { font-weight: 600; color: rgb(var(--c-ink)); }
    .md em { font-style: italic; }
    .md a { color: rgb(var(--c-accent)); text-decoration: underline; }
    .md ul ul { margin: .1rem 0; }

    @media (prefers-reduced-motion: reduce) {
      .lift, .btn-primary { transition: none; }
      .lift:hover { transform: none; }
      .spin { animation: none; }
    }
  </style>
</head>
<body class="font-sans bg-paper text-ink antialiased min-h-dvh">

  <header class="sticky top-0 z-30 bg-paper/85 backdrop-blur border-b border-line">
    <div class="max-w-3xl mx-auto px-5 h-14 flex items-center justify-between gap-3">
      <a href="/" class="flex items-center gap-2.5 shrink-0" aria-label="Scribe — This Week">
        <img src="/static/logo.png" alt="" width="28" height="28" class="block dark:invert" aria-hidden="true">
        <span class="font-display text-3xl font-semibold tracking-tight text-ink leading-none translate-y-[2px]">Scribe</span>
      </a>
      <div class="flex items-center gap-1">
        {% include "_nav.html" %}
        <button type="button" id="theme-btn" onclick="scribeCycleTheme()"
                aria-label="Theme: auto, light, or dark — click to change"
                title="Theme: Auto (follows your system)"
                class="ml-1 p-2 rounded-lg text-ink-soft hover:text-ink hover:bg-line/50 transition-colors">
          <svg data-theme-icon="auto" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
          </svg>
          <svg data-theme-icon="light" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <svg data-theme-icon="dark" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-5 pt-5 sm:pt-6 pb-8 sm:pb-10">
    {% block content %}{% endblock %}
  </main>

  {# Custom confirm dialog — replaces native confirm() for hx-confirm and
     [data-confirm] forms so prompts match the site's design. #}
  <div id="scribe-modal" style="display:none" class="fixed inset-0 z-50 items-center justify-center p-4">
    <div class="absolute inset-0 bg-ink/40 backdrop-blur-sm" onclick="scribeModalCancel()"></div>
    <div class="relative bg-surface border border-line rounded-2xl shadow-xl max-w-sm w-full p-5" role="dialog" aria-modal="true">
      <p id="scribe-modal-msg" class="text-sm text-ink leading-relaxed"></p>
      <div class="mt-5 flex items-center justify-end gap-2">
        <button type="button" onclick="scribeModalCancel()"
                class="px-3 py-1.5 rounded-lg text-sm font-medium text-ink-soft hover:bg-line/50 transition-colors">Cancel</button>
        <button type="button" id="scribe-modal-ok" onclick="scribeModalOk()"
                class="btn-primary px-3.5 py-1.5 rounded-lg text-sm font-semibold">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    // Theme: cycle Auto → Light → Dark. "Auto" follows the OS (live).
    const SCRIBE_THEMES = ['auto', 'light', 'dark'];
    function scribeThemeSetting() {
      try { return localStorage.getItem('scribe-theme') || 'auto'; } catch (e) { return 'auto'; }
    }
    function scribeApplyTheme() {
      const s = scribeThemeSetting();
      const dark = s === 'dark' ||
        (s === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.dataset.themeSetting = s;
      const btn = document.getElementById('theme-btn');
      if (btn) {
        const label = s.charAt(0).toUpperCase() + s.slice(1);
        btn.title = s === 'auto' ? 'Theme: Auto (follows your system)' : 'Theme: ' + label;
      }
    }
    function scribeCycleTheme() {
      const next = SCRIBE_THEMES[(SCRIBE_THEMES.indexOf(scribeThemeSetting()) + 1) % SCRIBE_THEMES.length];
      try { localStorage.setItem('scribe-theme', next); } catch (e) {}
      scribeApplyTheme();
    }
    // When on Auto, follow the OS appearance live (e.g. macOS day/night switch).
    try {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (scribeThemeSetting() === 'auto') scribeApplyTheme();
      });
    } catch (e) {}
    scribeApplyTheme();

    // After a duplicate group is merged or skipped, recount the dupes panel and
    // show a done-state once every group is resolved.
    function scribeAfterDupe() {
      const panel = document.getElementById('dupes-panel');
      if (!panel) return;
      const remaining = panel.querySelectorAll('.dupe-group').length;
      const count = document.getElementById('dupes-count');
      if (count) count.textContent = remaining;
      if (remaining === 0) {
        panel.innerHTML =
          '<div class="bg-surface rounded-xl border border-line p-4 text-center text-sm text-ink-soft">All set — duplicates resolved.</div>';
      }
    }

    // Client-side filter for the merge-candidate picker.
    function scribeFilterMerge(input) {
      const q = input.value.trim().toLowerCase();
      const form = input.closest('form');
      if (!form) return;
      form.querySelectorAll('.merge-cand').forEach(el => {
        el.style.display = (!q || (el.dataset.text || '').includes(q)) ? '' : 'none';
      });
    }

    // Completing a to-do: checking marks it done immediately (the server writes
    // [x]), then the row fades to the Done tab after a short grace window.
    // Unchecking within the window cancels it. Timers are keyed by data-key so
    // they survive the row's re-render after each toggle.
    const _scribeDoneTimers = {};
    const SCRIBE_DONE_DELAY = 6000;     // check in an open bucket → fade out to Done
    const SCRIBE_RESTORE_DELAY = 2000;  // uncheck on the Done tab → fade back to to-dos
    function _scribeSel(key) {
      return '.item-row[data-key="' + (window.CSS && CSS.escape ? CSS.escape(key) : key) + '"]';
    }
    // A row "leaves" the current view when its checkbox stops matching it: in an
    // open bucket a CHECKED row is departing to Done; on the Done tab an UNCHECKED
    // row is being restored to the to-dos. Either way, hold full opacity at the
    // click, fade out over a grace window (re-toggle to cancel), then collapse.
    function scribeSyncDoneTimers() {
      const list = document.getElementById('item-list');
      if (!list) return;
      const onDoneTab = list.getAttribute('data-view-bucket') === 'done';
      const delay = onDoneTab ? SCRIBE_RESTORE_DELAY : SCRIBE_DONE_DELAY;
      list.querySelectorAll('.item-row[data-key]').forEach(row => {
        const key = row.getAttribute('data-key');
        const cb = row.querySelector('input[type="checkbox"]');
        const checked = cb && cb.checked;
        const leaving = onDoneTab ? !checked : checked;
        if (leaving && !_scribeDoneTimers[key]) {
          // Pin opacity:1 and force a reflow so the transition has a committed
          // "from" state — without it the browser coalesces it into a jump.
          row.style.transition = 'none';
          row.style.opacity = '1';
          void row.offsetWidth;
          row.style.transition = 'opacity ' + delay + 'ms linear';
          row.style.opacity = '0.08';
          _scribeDoneTimers[key] = setTimeout(() => {
            delete _scribeDoneTimers[key];
            const r = list.querySelector(_scribeSel(key));
            const c = r && r.querySelector('input[type="checkbox"]');
            const stillLeaving = r && (onDoneTab ? !(c && c.checked) : (c && c.checked));
            // Clear the slow fade's inline transition so the final collapse uses
            // its own quick height/opacity animation.
            if (stillLeaving) { r.style.transition = ''; scribeRemoveRow(r); setTimeout(scribeRefreshCounts, 360); }
          }, delay);
        } else if (!leaving && _scribeDoneTimers[key]) {
          clearTimeout(_scribeDoneTimers[key]);
          delete _scribeDoneTimers[key];
          // Cancelled in time — drop the inline fade so the row returns to normal.
          row.style.transition = ''; row.style.opacity = '';
        }
      });
    }

    function scribeRefreshCounts() {
      fetch('/stats').then(r => r.json()).then(s => {
        const set = (sel, v) => { const e = document.querySelector(sel); if (e && v !== undefined) e.textContent = v; };
        set('#stat-open', s.open_action_items);
        set('#stat-notes', s.note_count);
        document.querySelectorAll('[data-open-count]').forEach(el => {
          if (s.open_action_items !== undefined) {
            el.textContent = s.open_action_items;
            el.style.display = s.open_action_items > 0 ? '' : 'none';
          }
        });
        document.querySelectorAll('[data-badge]').forEach(el => {
          const k = el.getAttribute('data-badge');
          const v = (k === 'done') ? s.done : (s.buckets || {})[k];
          if (v !== undefined) el.textContent = v;
        });
        // Someday review queue badge (only shows when something is waiting).
        document.querySelectorAll('[data-someday-count]').forEach(el => {
          const v = s.someday_review;
          if (v !== undefined) {
            el.textContent = v;
            el.style.display = v > 0 ? '' : 'none';
          }
        });
      }).catch(() => {});
    }

    // Inline note-title rename: swap the title for an input where it sits.
    // Toggle via inline style.display — an author `.flex { display:flex }` rule
    // beats the `hidden` attribute, so the attribute alone wouldn't hide the form.
    function scribeStartRename(el) {
      const root = el.closest('#note-header');
      if (!root) return;
      const disp = root.querySelector('[data-title-display]');
      const eb = root.querySelector('[data-title-editbtn]');
      const form = root.querySelector('[data-title-form]');
      if (disp) disp.style.display = 'none';
      if (eb) eb.style.display = 'none';
      if (form) {
        form.style.display = 'flex';
        const inp = form.querySelector('[data-title-input]');
        if (inp) { inp.focus(); inp.select(); }
      }
    }
    function scribeCancelRename(btn) {
      const root = btn.closest('#note-header');
      if (!root) return;
      const form = root.querySelector('[data-title-form]');
      const disp = root.querySelector('[data-title-display]');
      const eb = root.querySelector('[data-title-editbtn]');
      if (form) form.style.display = 'none';
      if (disp) disp.style.display = '';
      if (eb) eb.style.display = '';
    }

    // Inline category re-tag (general notes): swap the category label for an input.
    function scribeStartCat(el) {
      const root = el.closest('#note-header');
      if (!root) return;
      const disp = root.querySelector('[data-cat-display]');
      const form = root.querySelector('[data-cat-form]');
      if (disp) disp.style.display = 'none';
      if (form) {
        form.style.display = '';
        const inp = form.querySelector('[data-cat-input]');
        if (inp) { inp.focus(); inp.select(); }
      }
    }
    function scribeCancelCat(el) {
      const root = el.closest('#note-header');
      if (!root) return;
      const form = root.querySelector('[data-cat-form]');
      const disp = root.querySelector('[data-cat-display]');
      if (form) form.style.display = 'none';
      if (disp) disp.style.display = '';
    }

    // Custom confirm modal — replaces native confirm().
    let _scribeConfirmCb = null;
    function scribeConfirm(message, onConfirm) {
      const m = document.getElementById('scribe-modal');
      if (!m) { if (onConfirm) onConfirm(); return; }
      document.getElementById('scribe-modal-msg').textContent = message || 'Are you sure?';
      _scribeConfirmCb = onConfirm || null;
      m.style.display = 'flex';
      const ok = document.getElementById('scribe-modal-ok');
      if (ok) ok.focus();
    }
    function scribeModalCancel() {
      const m = document.getElementById('scribe-modal');
      if (m) m.style.display = 'none';
      _scribeConfirmCb = null;
    }
    function scribeModalOk() {
      const cb = _scribeConfirmCb;
      scribeModalCancel();
      if (cb) cb();
    }
    document.addEventListener('keydown', (e) => {
      const m = document.getElementById('scribe-modal');
      if (!m || m.style.display === 'none') return;
      if (e.key === 'Escape') { e.preventDefault(); scribeModalCancel(); }
      else if (e.key === 'Enter') { e.preventDefault(); scribeModalOk(); }
    });
    // Route htmx's hx-confirm prompts through the custom modal.
    document.body.addEventListener('htmx:confirm', (e) => {
      if (!e.detail.question) return;            // element has no hx-confirm
      e.preventDefault();
      scribeConfirm(e.detail.question, () => e.detail.issueRequest(true));
    });
    // Route plain (non-htmx) [data-confirm] form submits through the modal too.
    document.body.addEventListener('submit', (e) => {
      const f = e.target;
      if (f.matches && f.matches('form[data-confirm]') && !f.dataset.confirmed) {
        e.preventDefault();
        scribeConfirm(f.getAttribute('data-confirm'), () => { f.dataset.confirmed = '1'; f.submit(); });
      }
    });

    function scribeCollapse(el) {
      if (!el || el.classList.contains('archiving')) return;
      el.style.maxHeight = el.offsetHeight + 'px';
      el.classList.add('archiving');
      requestAnimationFrame(() => {
        el.style.maxHeight = '0px';
        el.style.opacity = '0';
        el.style.paddingTop = '0'; el.style.paddingBottom = '0';
        el.style.marginTop = '0'; el.style.marginBottom = '0';
      });
      setTimeout(() => el.remove(), 340);
    }

    function scribeRemoveRow(row) {
      const section = row.closest('section');
      if (section && section.querySelectorAll('.item-row').length <= 1) scribeCollapse(section);
      else scribeCollapse(row);
    }

    function scribeReconcileMoved() {
      const list = document.getElementById('item-list');
      if (!list) return;
      const view = list.getAttribute('data-view-bucket');
      if (!view || view === 'done') return;
      list.querySelectorAll('.item-row[data-bucket]').forEach(row => {
        if (row.getAttribute('data-bucket') !== view) scribeRemoveRow(row);
      });
    }

    document.body.addEventListener('htmx:afterSwap', scribeReconcileMoved);
    document.body.addEventListener('htmx:afterRequest', (e) => {
      scribeSyncDoneTimers();
      scribeRefreshCounts();
      // A consolidated duplicate group: drop its card from the panel and recount.
      const cfg = e.detail && e.detail.requestConfig;
      if (e.detail && e.detail.successful && cfg && cfg.path === '/action-items/merge-group') {
        const card = e.detail.elt && e.detail.elt.closest('.dupe-group');
        if (card) card.remove();
        scribeAfterDupe();
      }
    });
    scribeSyncDoneTimers();
    scribeRefreshCounts();
  </script>
</body>
</html>
