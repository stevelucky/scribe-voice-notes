{% if notes %}
<div class="space-y-2">
  {% for n in notes %}
  <a href="/note?file={{ n.filename | urlencode }}&from=notes"
     class="lift block bg-surface rounded-xl border border-line px-4 py-3.5 flex items-baseline justify-between gap-3 hover:border-accent/30">
    <span class="font-medium text-ink truncate">{{ n.title }}</span>
    <span class="shrink-0 flex items-baseline gap-2 whitespace-nowrap">
      {% set tag = n.category or ((n.type | replace('_', ' ') | title) if (n.type and n.type != 'default') else '') %}
      {% if tag %}<span class="text-[11px] px-2 py-0.5 rounded-full bg-line/70 text-ink-soft">{{ tag }}</span>{% endif %}
      <span class="font-mono text-xs text-ink-faint">{{ n.date }}</span>
    </span>
  </a>
  {% endfor %}
</div>
{% else %}
<div class="bg-surface rounded-xl border border-dashed border-line py-20 text-center">
  <p class="font-display text-xl text-ink-soft">No notes found.</p>
  <p class="mt-1 text-sm text-ink-faint">Try a different search.</p>
</div>
{% endif %}
